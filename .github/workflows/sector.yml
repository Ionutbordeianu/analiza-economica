name: Actualizare automată date sector

on:
  schedule:
    - cron: '17 3 * * 1'   # în fiecare luni, 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Recalculează chiar dacă sursele nu s-au schimbat (da / nu)'
        required: false
        default: 'nu'

permissions:
  contents: write
  pages: write

jobs:
  actualizare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verifică data.gov.ro și recalculează sectoarele
        run: node --max-old-space-size=6144 build_sector.mjs
        env:
          FORCE: ${{ github.event.inputs.force == 'da' && '1' || '' }}
      - name: Publică dacă datele s-au schimbat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- sector.json; then
            echo "Datele sunt deja la zi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sector.json
          git commit -m "Actualizare automată: date de sector de pe data.gov.ro"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
